<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashruba..PDF - Image to PDF & OCR App</title>
    <!-- Tailwind CSS UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Tesseract.js (Bangla & English OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .drag-over { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-md">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Mashruba..PDF</h1>
            <span class="text-xs bg-blue-800 px-3 py-1 rounded-full border border-blue-400">🔒 100% Client-Side / Secure</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        
        <!-- App Card -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-2">ছবি নির্বাচন করুন (সর্বোচ্চ ২০ টি পেজ)</h2>
            <p class="text-sm text-gray-500 mb-4">বাংলা বা ইংরেজি লেখার ছবি আপলোড করে মুহূর্তেই PDF তৈরি করুন।</p>

            <!-- File Upload Box -->
            <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500 transition duration-200">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="text-gray-700 font-medium">এখানে ছবি ড্রাগ করুন অথবা <span class="text-blue-600 underline">ব্রাউজ করুন</span></p>
                <p class="text-xs text-gray-400 mt-1">সর্বোচ্চ ২০ টি ছবি একসাথে নির্বাচন করা যাবে</p>
                <input type="file" id="imageInput" multiple accept="image/*" class="hidden">
            </div>

            <!-- Controls & Options -->
            <div class="mt-6 flex flex-wrap gap-4 items-center justify-between border-t pt-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">PDF মোড সিলেক্ট করুন:</label>
                    <select id="pdfMode" class="border rounded-md px-3 py-2 text-sm bg-gray-50">
                        <option value="image">Direct Image PDF (ইনস্ট্যান্ট ও অরিজিনাল লুক)</option>
                        <option value="ocr">Bangla + English OCR Text PDF (লেখা বের করে PDF)</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button id="clearBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-semibold hover:bg-gray-300 hidden">মুছে ফেলুন</button>
                    <button id="generatePdfBtn" disabled class="bg-blue-600 text-white px-6 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 opacity-50 cursor-not-allowed">PDF ডাউনলোড করুন</button>
                </div>
            </div>
        </div>

        <!-- Progress Container -->
        <div id="progressContainer" class="bg-white rounded-xl shadow p-4 mb-6 hidden">
            <div class="flex justify-between items-center mb-2">
                <span id="progressText" class="text-sm font-medium text-gray-700">প্রসেসিং শুরু হচ্ছে...</span>
                <span id="progressPercent" class="text-sm font-bold text-blue-600">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Image Previews Container -->
        <div id="previewHeader" class="text-lg font-semibold mb-3 hidden">সিলেক্ট করা পেজসমূহ (<span id="selectedCount">0</span>/20):</div>
        <div id="previewGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

    </main>

    <script>
        const MAX_FILES = 20;
        let selectedFiles = [];

        // DOM elements
        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const previewGrid = document.getElementById('previewGrid');
        const previewHeader = document.getElementById('previewHeader');
        const selectedCount = document.getElementById('selectedCount');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const clearBtn = document.getElementById('clearBtn');
        const pdfMode = document.getElementById('pdfMode');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');

        // Drag and Drop handlers
        dropZone.addEventListener('click', () => imageInput.click());
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
            handleFiles(files);
        });

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            if (selectedFiles.length + files.length > MAX_FILES) {
                alert(`আপনি সর্বোচ্চ ${MAX_FILES} টি ছবি সিলেক্ট করতে পারবেন!`);
                files = files.slice(0, MAX_FILES - selectedFiles.length);
            }

            selectedFiles = [...selectedFiles, ...files];
            updatePreview();
        }

        function updatePreview() {
            previewGrid.innerHTML = '';
            selectedCount.textContent = selectedFiles.length;

            if (selectedFiles.length > 0) {
                previewHeader.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                generatePdfBtn.disabled = false;
                generatePdfBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                previewHeader.classList.add('hidden');
                clearBtn.classList.add('hidden');
                generatePdfBtn.disabled = true;
                generatePdfBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const card = document.createElement('div');
                    card.className = "relative bg-white p-2 rounded-lg shadow border group";
                    card.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-32 object-cover rounded">
                        <span class="absolute top-3 left-3 bg-black bg-opacity-70 text-white text-xs px-2 py-0.5 rounded-full">Page ${index + 1}</span>
                        <button onclick="removeImage(${index})" class="absolute top-3 right-3 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow hover:bg-red-700">✕</button>
                        <p class="text-xs text-gray-500 mt-1 truncate">${file.name}</p>
                    `;
                    previewGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeImage = function(index) {
            selectedFiles.splice(index, 1);
            updatePreview();
        };

        clearBtn.addEventListener('click', () => {
            selectedFiles = [];
            imageInput.value = '';
            updatePreview();
        });

        // PDF Generation Logic
        generatePdfBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const mode = pdfMode.value;
            progressContainer.classList.remove('hidden');
            generatePdfBtn.disabled = true;

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');

            if (mode === 'image') {
                // Direct Image to PDF
                for (let i = 0; i < selectedFiles.length; i++) {
                    const percent = Math.round(((i + 1) / selectedFiles.length) * 100);
                    updateProgress(percent, `পেজ ${i + 1}/${selectedFiles.length} প্রসেস করা হচ্ছে...`);

                    const imgData = await fileToDataURL(selectedFiles[i]);
                    const imgProps = await getImageProperties(imgData);

                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();

                    // Calculate scaling to fit A4 page
                    const ratio = Math.min(pdfWidth / imgProps.width, pdfHeight / imgProps.height);
                    const width = imgProps.width * ratio;
                    const height = imgProps.height * ratio;
                    const x = (pdfWidth - width) / 2;
                    const y = (pdfHeight - height) / 2;

                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', x, y, width, height);
                }

                pdf.save('Mashruba_PDF_Document.pdf');
                finishProcessing();

            } else if (mode === 'ocr') {
                // Bangla + English OCR Text Extraction
                const worker = await Tesseract.createWorker('ben+eng');

                for (let i = 0; i < selectedFiles.length; i++) {
                    const progressVal = Math.round(((i) / selectedFiles.length) * 100);
                    updateProgress(progressVal, `পেজ ${i + 1}/${selectedFiles.length} থেকে বাংলা ও ইংরেজি টেক্সট পড়া হচ্ছে...`);

                    const ret = await worker.recognize(selectedFiles[i]);
                    const text = ret.data.text;

                    if (i > 0) pdf.addPage();
                    
                    // Format text for PDF page
                    const splitText = pdf.splitTextToSize(text || "No readable text found.", 180);
                    pdf.setFontSize(11);
                    pdf.text(splitText, 15, 15);
                }

                await worker.terminate();
                updateProgress(100, "PDF তৈরি সম্পন্ন হয়েছে!");
                pdf.save('Mashruba_PDF_OCR_Document.pdf');
                finishProcessing();
            }
        });

        function updateProgress(percent, statusText) {
            progressBar.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
            progressText.textContent = statusText;
        }

        function finishProcessing() {
            setTimeout(() => {
                progressContainer.classList.add('hidden');
                generatePdfBtn.disabled = false;
                progressBar.style.width = '0%';
            }, 1500);
        }

        function fileToDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function getImageProperties(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ width: img.width, height: img.height });
                img.src = dataUrl;
            });
        }
    </script>
</body>
</html>
