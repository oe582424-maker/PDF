<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocStudio Pro - OCR & PDF Generator</title>
  
  <!-- Fonts & Libraries -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border-color: #334155;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    /* Header Nav */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-logo {
      background: var(--accent-blue);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .badge {
      background: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 8px 12px;
    }

    .btn-clear:hover {
      color: #fff;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Main Container */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Upload Box */
    .dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .dropzone:hover {
      border-color: var(--accent-blue);
    }

    .dropzone-icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    .dropzone-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .dropzone-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* OCR Progress */
    .progress-bar {
      display: none;
      width: 100%;
      height: 6px;
      background: var(--input-bg);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-blue);
      transition: width 0.2s ease;
    }

    /* Editor Section */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .editor-header span {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    textarea.editor-textarea {
      width: 100%;
      min-height: 220px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    /* Live Preview Section */
    .preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* A4 Paper Simulation */
    .paper-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    .a4-paper {
      background: #ffffff;
      color: #111827;
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      padding: 25mm 20mm;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .paper-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #111827;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .paper-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111827;
    }

    .paper-sub {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .paper-content {
      font-family: 'Hind Siliguri', serif;
      flex-grow: 1;
      white-space: pre-wrap;
      word-wrap: break-word;
      text-align: justify;
    }

    .paper-footer {
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9ca3af;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .a4-paper {
        padding: 15mm 10mm;
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">D</div>
      <span>DocStudio</span>
      <span class="badge">Pro A4</span>
    </div>
    <div class="nav-actions">
      <button class="btn-clear" onclick="clearEditor()">Clear Text</button>
      <button class="btn-primary" onclick="exportPDF()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        Export A4 PDF
      </button>
    </div>
  </header>

  <!-- App Body -->
  <div class="container">
    <div class="control-card">
      
      <!-- Document Settings -->
      <div class="form-group">
        <label>Document Title</label>
        <input type="text" id="docTitle" class="form-control" value="Document Sheet" oninput="updatePreview()">
      </div>

      <div class="grid-2 form-group">
        <div>
          <label>Font Size</label>
          <select id="fontSizeSelect" class="form-control" onchange="updatePreview()">
            <option value="12px">Compact (9pt)</option>
            <option value="15px" selected>Normal (11pt)</option>
            <option value="18px">Large (13pt)</option>
          </select>
        </div>
        <div>
          <label>Line Spacing</label>
          <select id="lineSpacingSelect" class="form-control" onchange="updatePreview()">
            <option value="1.4">Tight (1.4)</option>
            <option value="1.8" selected>Standard (1.8)</option>
            <option value="2.2">Relaxed (2.2)</option>
          </select>
        </div>
      </div>

      <!-- OCR File Upload Area -->
      <div class="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon">📷</div>
        <div class="dropzone-title">Import Text from Image (OCR)</div>
        <div class="dropzone-sub">Drag & drop photo or click to browse</div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="statusText" style="font-size: 0.8rem; color: #60a5fa; margin-top: 6px;"></div>
      </div>

    </div>

    <!-- Text Editor Section -->
    <div class="control-card">
      <div class="editor-header">
        <span>Editor Content</span>
        <span id="wordCount">0 Words</span>
      </div>
      <textarea id="editor" class="editor-textarea" placeholder="Extracted text will appear here. You can also type directly..." oninput="updatePreview()"></textarea>
    </div>

    <!-- Live Paper Preview -->
    <div class="preview-bar">
      <span>● Live A4 Paper Preview</span>
      <span>210mm × 297mm Standard</span>
    </div>

    <div class="paper-wrapper">
      <div id="paper-preview" class="a4-paper">
        <div>
          <div class="paper-header">
            <div class="paper-title" id="previewTitle">Document Sheet</div>
            <div class="paper-sub">DocStudio A4</div>
          </div>
          <div class="paper-content" id="previewContent">
            <!-- Text rendered dynamically -->
          </div>
        </div>
        <div class="paper-footer">
          <span>Generated via DocStudio</span>
          <span>Standard Vector Output</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Live UI Sync
    function updatePreview() {
      const titleText = document.getElementById('docTitle').value;
      const editorText = document.getElementById('editor').value;
      const fontSize = document.getElementById('fontSizeSelect').value;
      const lineSpacing = document.getElementById('lineSpacingSelect').value;

      document.getElementById('previewTitle').innerText = titleText || 'Document Sheet';
      
      const contentElem = document.getElementById('previewContent');
      contentElem.innerText = editorText;
      contentElem.style.fontSize = fontSize;
      contentElem.style.lineHeight = lineSpacing;

      // Update Word Count
      const words = editorText.trim() ? editorText.trim().split(/\s+/).length : 0;
      document.getElementById('wordCount').innerText = `${words} Words`;
    }

    // OCR Engine (Bengali + English)
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      const statusText = document.getElementById('statusText');

      progressBar.style.display = 'block';
      statusText.innerText = 'Initializing OCR Engine...';
      progressFill.style.width = '10%';

      try {
        const worker = await Tesseract.createWorker(['ben', 'eng']);
        
        statusText.innerText = 'Scanning & Processing Document...';
        
        const ret = await worker.recognize(file, {}, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const progress = Math.round(m.progress * 100);
              progressFill.style.width = `${progress}%`;
              statusText.innerText = `Scanning: ${progress}%`;
            }
          }
        });

        document.getElementById('editor').value = ret.data.text;
        updatePreview();

        statusText.innerText = 'Extraction Complete!';
        setTimeout(() => {
          progressBar.style.display = 'none';
          statusText.innerText = '';
        }, 2000);

        await worker.terminate();
      } catch (err) {
        console.error(err);
        statusText.innerText = 'OCR Error. Please try another image.';
      }
    }

    // Clear Text
    function clearEditor() {
      document.getElementById('editor').value = '';
      updatePreview();
    }

    // Vector PDF Export
    function exportPDF() {
      const element = document.getElementById('paper-preview');
      const docTitle = document.getElementById('docTitle').value || 'document';

      const opt = {
        margin:       0,
        filename:     `${docTitle.toLowerCase().replace(/\s+/g, '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Initial Sync
    updatePreview();
  </script>
</body>
</html>
